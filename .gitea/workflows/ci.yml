# CI für das meta-skills-Plugin.
#
# WARUM ES SIE ERST SEIT 2026-07-28 GIBT
# Das Plugin setzt alle unsere Regeln durch — Geheimnis-Muster, Mock-Verbot,
# Negativbefund-Sperre, destruktive Kommandos — und hatte selbst **keine CI**. 725 Tests,
# die nur liefen, wenn jemand sie von Hand startete.
#
# Was das gekostet hat, an einem Tag gemessen:
#   * `token-audit.py` feuerte 9 statt 5433 mal (`matcher: ""` statt `'.*'`)
#   * `vault_get` fand NIE etwas — es liest eine Datei, die nicht existiert
#   * `is_healthy()` prüfte einen anderen Endpunkt als den, der benutzt wird
# Keiner davon wäre gefunden worden, weil es keinen automatischen Lauf gab.
#
# ROT SEIT 2026-07-29, FIX AM 2026-08-01 (TASK-2026-00922)
# Zwei Jobs riefen nacktes `python`, ohne vorher `actions/setup-python` laufen zu lassen —
# auf dem Executor-Image hinter `ubuntu-latest` (`node:20-bookworm`: hat node fuer die
# JS-Actions, aber KEIN python) stirbt das mit exit 127, bevor irgendetwas geprueft wird.
# Fix unten: beide Jobs bekommen den Schritt, den `test` schon hatte.
#
# WARUM PYTHON 3.9 FRUEHER IN DER MATRIX STAND — UND WARUM ES DAS JETZT NICHT MEHR IST
# `hooks.json` ruft die Hooks mit blankem `python3` auf. Auf dem Mac ist das **3.9.6**. Genau
# daran ist mal ein Hook gestorben (`datetime.UTC` gibt es erst ab 3.11) — er endete mit 0,
# schrieb nie, niemand sah es. Nur auf 3.12 zu testen wuerde diese Klasse systematisch
# uebersehen. ABER: `actions/setup-python` konnte auf diesem Runner 3.9 nicht liefern (Fund
# vom 2026-08-01) — gemessen am `actions/python-versions`-Manifest (raw.githubusercontent.com/
# actions/python-versions/main/versions-manifest.json): jede Linux-Datei traegt `platform_version`
# 16.04..26.04 (Ubuntu) oder rhel 9/10 — keine Debian-Zeile. Der Executor hinter `ubuntu-latest`
# ist aber Debian (`node:20-bookworm`), siehe KE-2026-07-23-CI-SETUPPY fuer denselben Fund an
# einem anderen Repo dieser Org ("not found for this operating system"). Ein bestimmtes `python`-
# Label mit echtem Ubuntu-Image koennte das wieder loesen, ist hier aber nicht gemessen — deshalb
# nicht angenommen.
#   Ersatz: `vermin --target=3.9` (statische Mindestversions-Analyse, braucht KEINEN echten
#   3.9-Interpreter) laeuft gegen hooks/ + scripts/. Das ist kein Downgrade der Absicht: der
#   erste Lauf hat sofort real etwas gefunden — `scripts/autoreason-skills.py:561` benutzte
#   `zip(..., strict=False)`, ein reines 3.10+-Feature (`strict=False` ist ohnehin der Default,
#   also entfernt statt ersetzt). Auf dem Mac (3.9.6) waere das ein `TypeError` gewesen.
#   Restluecke, ehrlich benannt: vermin prueft Syntax/API-Verfuegbarkeit statisch, keine echte
#   Laufzeit auf 3.9 — ein Bug, der nur zur Laufzeit unter genau 3.9 auftritt (nicht als
#   Sprach-/Stdlib-Feature erkennbar), faellt weiter durch. Naechster Schritt waere ein
#   `python`-Runner-Label mit echtem Ubuntu-Image, das setup-python 3.9 liefern kann — offen,
#   nicht Teil dieses Fixes.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        # Einzelversion statt Matrix: 3.9 ist auf diesem Runner ueber setup-python nicht
        # zu bekommen (siehe Kopfkommentar). 3.12 ist die gemessen funktionierende Version.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: zsh (die Launcher sind zsh-Skripte)
        # Ohne das schlagen die opencode-*-Launcher-Tests mit einer IRREFUEHRENDEN Meldung
        # fehl: Python meldet `FileNotFoundError: <das Skript>`, fehlend ist aber der
        # INTERPRETER aus dem Shebang. Auf dem Mac faellt es nie auf — dort ist zsh die
        # Standard-Shell.
        # NICHT auf bash umstellen: `${forwarded[1]}` ist in zsh das ERSTE Element, in bash
        # das zweite. Ein Shebang-Wechsel verschoebe still das Verhalten (.opencode-plugin/
        # launcher:89 und :126). Der Interpreter gehoert hierher, nicht die Skripte umgebogen.
        run: |
          apt-get update -qq && apt-get install -y -qq zsh
          zsh --version

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest vermin

      - name: Jeder Hook muss überhaupt importierbar sein
        # compileall findet Syntax, die 3.12 nicht kennt, BEVOR ein Test läuft.
        # Ein Hook, der beim Import stirbt, endet mit 0 und tut nichts — das ist die
        # unauffälligste Art zu scheitern.
        run: python -m compileall -q hooks/ scripts/

      - name: 3.9-Kompatibilität (statisch, da echtes 3.9 hier nicht verfügbar ist)
        # Ersatz fuer die fruehere 3.9-Matrix-Achse, s. Kopfkommentar. Faengt Syntax/Stdlib,
        # die neuer ist als das, was `hooks.json` per blankem `python3` auf dem Mac (3.9.6)
        # tatsaechlich vorfindet — ohne einen echten 3.9-Interpreter zu brauchen.
        # `python -m vermin` schlägt fehl (kein __main__.py, nur Konsolen-Skript) — lokal
        # gegen eine echte venv gemessen (TASK-2026-00922), nicht angenommen.
        run: vermin --target=3.9 --violations hooks/ scripts/

      - name: Testlauf
        run: python -m pytest -q

  hook-registrierung:
    # Eigener Auftrag, weil er ohne Python-Matrix auskommt und schnell ist: er prüft die
    # Registrierung, nicht den Code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        # War hier bis 2026-07-29 vergessen — nacktes `python` stirbt auf diesem Image
        # (node:20-bookworm) mit exit 127, ohne dass ueberhaupt geprueft wird (TASK-2026-00922).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kein Werkzeug-Ereignis mit leerem Matcher
        # DER Fund vom 2026-07-28. `matcher: ""` laesst einen PostToolUse-Hook fast nie
        # feuern und dann ohne Nutzlast — gemessen 9 Aufrufe statt 5433, alle mit
        # tool="unknown". Ein Zeichen Unterschied, den beim Lesen niemand bemerkt.
        run: |
          python - <<'PY'
          import json, sys
          reg = json.load(open("hooks/hooks.json"))
          fehler = []
          for ereignis in ("PreToolUse", "PostToolUse"):
              for e in reg.get("hooks", {}).get(ereignis, []):
                  namen = [h.get("command", "").rsplit("/", 1)[-1].replace('"', "")
                           for h in e.get("hooks", [])]
                  if e.get("matcher", None) == "":
                      fehler.append(f"{ereignis}: leerer matcher bei {', '.join(namen)}")
                  elif "matcher" not in e:
                      fehler.append(f"{ereignis}: matcher fehlt bei {', '.join(namen)}")
          for f in fehler:
              print(f"  {f}")
          if fehler:
              print("\nFuer 'alle Werkzeuge' gehoert '.*' dorthin, nicht ''.")
              sys.exit(1)
          print("  Registrierung in Ordnung.")
          PY

      - name: Jeder registrierte Hook muss existieren
        # Ein Eintrag, der auf eine geloeschte Datei zeigt, faellt sonst nie auf: Claude
        # Code meldet den Fehlschlag nicht, der Hook laeuft einfach nicht.
        run: |
          python - <<'PY'
          import json, pathlib, sys
          reg = json.load(open("hooks/hooks.json"))
          fehlt = []
          for ereignis, eintraege in reg.get("hooks", {}).items():
              for e in eintraege:
                  for h in e.get("hooks", []):
                      cmd = h.get("command", "")
                      if "${CLAUDE_PLUGIN_ROOT}/" not in cmd:
                          continue
                      # Quotes UND Argumente abtrennen. Erster Anlauf lieferte
                      # 'hooks/run-hook.cmd" on-stop' als Dateinamen — ein Fehlalarm,
                      # der die CI beim ersten Lauf rot gemacht haette.
                      rest = cmd.split("${CLAUDE_PLUGIN_ROOT}/", 1)[1]
                      rel = rest.split('"')[0].split("'")[0].split()[0]
                      if not pathlib.Path(rel).exists():
                          fehlt.append(f"{ereignis}: {rel}")
          for f in fehlt:
              print(f"  fehlt: {f}")
          sys.exit(1 if fehlt else 0)
          PY

  geheimnisse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        # War hier bis 2026-07-29 vergessen — nacktes `python` stirbt auf diesem Image
        # (node:20-bookworm) mit exit 127, ohne dass ueberhaupt geprueft wird (TASK-2026-00922).
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kein Zugangsdatum im Repo
        # Bewusst grob und ohne Whitelist: eine Ausnahmeliste, die gepflegt werden muss,
        # wird nicht gepflegt. Lieber ein Fehlalarm, der eine Minute kostet, als ein Token,
        # das nach Gitea geht.
        run: |
          python - <<'PY'
          import pathlib, re, sys
          MUSTER = [
              (re.compile(r"\bsk-[A-Za-z0-9_-]{20,}"), "OpenAI-artiger Schluessel"),
              (re.compile(r"\baie-[A-Za-z0-9_-]{24,}"), "Bruecken-Token"),
              (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"), "privater Schluessel"),
              (re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}"), "GitHub-Token"),
          ]
          treffer = []
          for p in pathlib.Path(".").rglob("*"):
              if not p.is_file() or ".git/" in str(p):
                  continue
              if p.suffix in {".png", ".jpg", ".gif", ".zip", ".gz", ".pdf", ".ico"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              for muster, name in MUSTER:
                  for m in muster.finditer(text):
                      w = m.group(0)
                      treffer.append(f"{p}: {name} {w[:6]}…{w[-4:]}")
          for t in treffer[:20]:
              print(f"  {t}")
          sys.exit(1 if treffer else 0)
          PY
