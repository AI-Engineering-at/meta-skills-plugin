# Dependabot v2 — weekly automated dependency PRs.
# Scope: github-actions only (no language manifest at root).
# Limit: 5 open PRs per ecosystem to avoid review storms.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
